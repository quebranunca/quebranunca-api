name: Relatar problema
description: Registre um comportamento incorreto ou uma regressão.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: O que estava sendo feito e qual era o resultado esperado?
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Informe os passos mínimos, sem incluir credenciais ou dados pessoais.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente ou versão
      placeholder: Local, staging ou produção; tag/commit quando conhecido
  - type: checkboxes
    id: seguranca
    attributes:
      label: Segurança
      options:
        - label: Confirmei que isto não expõe vulnerabilidade, segredo ou dado pessoal. Casos de segurança serão enviados por advisory privado.
          required: true
